name: Upload from MEGA to GitHub Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 2.0.0)'
        required: true
        default: '1.0.0'
      mega_url:
        description: 'MEGA link(s) — up to 6, separated by spaces'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install megatools
        run: |
          sudo apt update
          sudo apt install -y megatools

      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version_tag }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag (if new release)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "v${{ inputs.version_tag }}"
          git push origin "v${{ inputs.version_tag }}"

      # ✅ Download all links (space separated)
      - name: Download files from MEGA
        env:
          MEGA_URLS: ${{ inputs.mega_url }}
        run: |
          mkdir -p mega-files
          cd mega-files

          # Split on whitespace into an array
          read -r -a LINKS <<< "$MEGA_URLS"

          if [ "${#LINKS[@]}" -eq 0 ]; then
            echo "No MEGA links provided"; exit 1
          fi

          if [ "${#LINKS[@]}" -gt 6 ]; then
            echo "Too many links (${#LINKS[@]}). Max is 6."; exit 1
          fi

          i=0
          for link in "${LINKS[@]}"; do
            i=$((i+1))
            echo "── [${i}/${#LINKS[@]}] Downloading: $link"
            megatools dl --no-progress "$link" || echo "⚠️ Failed: $link"
          done

      - name: Show downloaded files
        run: ls -lhR mega-files/

      - name: Create new release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version_tag }}"
          name: "apps-full"
          body: |
            🧩 **Native Apps for XoDos**

            ### ✅ What's New
            - Added files from cloud

            ---
            
            **💬 Support**  
            Telegram: [t.me/xodemulatorr](https://t.me/xodemulatorr)  
            Discord: [discord.gg/d2ChVhPfnF](https://discord.gg/d2ChVhPfnF)
          files: |
            mega-files/*
            mega-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add files to existing release
        if: steps.check_release.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version_tag }}"
          files: |
            mega-files/*
            mega-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}