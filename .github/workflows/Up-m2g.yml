name: Upload from MEGA to GitHub Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 2.0.0)'
        required: true
        default: '1.0.0'
      mega_url:
        description: 'MEGA download link (direct link to file or folder)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install megatools
        run: |
          sudo apt update
          sudo apt install -y megatools

      # Check if a release for this tag already exists
      - name: Check if release exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ inputs.version_tag }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # Only create and push the Git tag if the release does NOT exist
      - name: Create Git Tag (if new release)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "v${{ inputs.version_tag }}"
          git push origin "v${{ inputs.version_tag }}"

      # Download files from MEGA using the provided URL
      - name: Download files from MEGA
        run: |
          mkdir -p mega-files
          cd mega-files
          megatools dl "${{ inputs.mega_url }}"

      - name: Show downloaded files
        run: ls -lh mega-files/

      # 🆕 New release → create with body, tag, and all files
      - name: Create new release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version_tag }}"
          name: "apps-full"
          body: |
            🧩 **Native Apps for XoDos**

            ### ✅ What's New
            - Added files from MEGA

            ---
            **👥 Credits**  
            python: @xodiosx • Logos: @sabamdarif  
            **💬 Support**  
            Telegram: [t.me/xodemulatorr](https://t.me/xodemulatorr)  
            Discord: [discord.gg/d2ChVhPfnF](https://discord.gg/d2ChVhPfnF)
          files: |
            mega-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ♻️ Existing release → only add files, keep body and tag unchanged
      - name: Add files to existing release
        if: steps.check_release.outputs.exists == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version_tag }}"
          files: |
            mega-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}